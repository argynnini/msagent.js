<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>msagent.js example</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; background: #3a6ea5; color: #fff; min-height: 100vh; }
      button, input { font: inherit; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
      #list { display: flex; flex-wrap: wrap; gap: 4px; max-width: 720px; }
    </style>
  </head>
  <body>
    <h1>msagent.js</h1>
    <div class="row">
      <input type="file" id="file" accept=".acs,.act" />
      <label><input type="checkbox" id="sound" checked /> 効果音</label>
      <label><input type="checkbox" id="voice" checked /> 読み上げ</label>
    </div>
    <form class="row" id="speak">
      <input id="text" value="こんにちは。何かお手伝いしましょうか？" size="40" />
      <button>speak</button>
      <button type="button" id="animate">animate</button>
      <button type="button" id="move">moveTo</button>
      <button type="button" id="gesture">gestureAt</button>
      <button type="button" id="stop">stop</button>
      <button type="button" id="toggle">hide / show</button>
    </form>
    <div id="list"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
